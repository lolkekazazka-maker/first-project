
[Timers]
	#Surface timer multiplier
	#Range: 0.0 ~ 5.0
	surface_timer_multiplier = 1.0

	[Timers.Spawn]
		#Minimum time between spawns in seconds
		#Range: 0 ~ 86400
		can_spawn_min = 300
		#Maximum time between spawns in seconds
		#Range: 0 ~ 86400
		can_spawn_max = 600
		#Chance for a spawn cooldown to occur
		#Range: 0.0 ~ 1.0
		can_spawn_cooldown_chance = 0.4
		#Spawn cooldown length in seconds
		#Range: 0 ~ 86400
		can_spawn_cooldown = 200

	[Timers.Noise]
		#Minimum time between noise occurrences in seconds
		#Range: 0 ~ 86400
		reset_noise_min = 240
		#Maximum time between noise occurrences in seconds
		#Range: 0 ~ 86400
		reset_noise_max = 360

	[Timers.Leave]
		#Time (in seconds) it takes for the Hydra to leave
		#Range: 1 ~ 6000
		time_until_leave = 300
		#Time (in seconds) it takes for the Hydra to leave once a chase begins
		#Range: 1 ~ 600
		time_until_leave_chase = 30

["Spawn Conditions"]
	#The spawn chance per tick
	#Range: 0.0 ~ 1.0
	spawn_chance_per_tick = 0.004
	#Depth at which the Hydra can start to spawn
	spawn_height = 300
	#Whether the Hydra can spawn on the surface or not
	allow_surface_spawn = true
	#The maximum sky light level
	#Range: 0 ~ 15
	sky_light_level = 15
	#The maximum block light level
	#Range: 0 ~ 15
	block_light_level = 15
	#The maximum amount of Hydras
	#Range: 0 ~ 100
	maximum_amount = 1
	#Minimum spawn distance from players (in blocks)
	#Range: 0 ~ 64
	spawn_distance = 20
	#Require a valid path to the target for spawning
	require_path_to_spawn = false

	["Spawn Conditions".Dimensions]
		#The dimensions where the Hydra can spawn
		dimension_whitelist = ["minecraft:overworld"]

	["Spawn Conditions".Biomes]
		#Override biome datapack config
		override_biome_datapack_config = true
		#Use the surface biome list as whitelist
		surface_biomes_is_whitelist = false
		#White- or blacklist of surface biomes
		surface_biomes = []

[Behaviour]
	#Distance at which the Hydra detects if a player looks at it
	#Range: 0 ~ 128
	spotting_range = 60
	#Whether it can disable shields
	can_disable_shields = true
	#Whether it can climb
	can_climb = true
	#Whether it can break doors
	can_break_door = true
	#Time (seconds) to break a door
	#Range: 1 ~ 60
	break_door_time = 3
	#Allow vanilla riding logic
	allow_riding = false
	#Whether invisible players can be targets
	target_invisible = true

[Attributes]
	#Maximum health
	#Range: 1.0 ~ 100000.0
	maximum_health = 600.0
	#Attack damage
	#Range: 0.0 ~ 1000.0
	attack_damage = 6.0
	#Attack speed
	#Range: 0.0 ~ 10.0
	attack_speed = 0.35
	#Movement speed
	#Range: 0.0 ~ 5.0
	movement_speed = 0.55
	#Depth Strider bonus in water
	#Range: 0.0 ~ 3.0
	depth_strider_bonus = 1.5

[Misc]
	#Only play ambient noises to the current spawn target
	only_play_noise_to_target = false
	#Enable debug logging for spawn attempts
	debug_logging = false

